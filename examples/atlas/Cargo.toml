[package]
name = "rustybox-atlas"
version = "0.8.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
rustybox-assets = { path = "../../crates/assets" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"
rustybox-sdk = { path = "../../crates/sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Imaging", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
