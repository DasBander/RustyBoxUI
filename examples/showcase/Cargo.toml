[package]
name = "rustybox-showcase"
version = "0.5.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
rustybox-assets = { path="../../crates/assets" }
rustybox-sdk = { path = "../../crates/sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows = { version = "0.62.2", features = ["Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_UI_Input_XboxController"] }
