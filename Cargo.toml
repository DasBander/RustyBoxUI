[workspace]
members = ["crates/assets", "crates/build", "crates/cli", "crates/core", "crates/ui", "crates/graphics", "crates/sdk", "examples/launcher", "examples/atlas", "examples/starter", "examples/steam", "examples/showcase"]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
serde_json = "1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_DirectComposition", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility"] }
libloading = "0.8.9"

[profile.release]
lto = "thin"
strip = "debuginfo"
