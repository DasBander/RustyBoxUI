[package]
name = "rustybox-sdk"
version = "0.3.6"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
rustybox-core = { path = "../core" }
libloading = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common"] }
