[package]
name = "rustybox-sdk"
version = "0.7.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
rustybox-core = { path = "../core" }
tempfile = "3"
libloading = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_RemoteDesktop", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
